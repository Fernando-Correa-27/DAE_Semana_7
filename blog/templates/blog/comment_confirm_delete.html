{% extends "blog/base.html" %}

{% block title %}Eliminar comentario · Lab Blog{% endblock %}

{% block content %}
<div class="confirm-card">
  <div class="confirm-icon danger">
    <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
  </div>
  <h1>Eliminar comentario</h1>
  <p>Vas a eliminar permanentemente este comentario de <strong>«{{ object.post.title }}»</strong>:</p>
  <blockquote class="confirm-quote">«{{ object.text|truncatewords:30 }}»</blockquote>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions center">
      <button type="submit" class="btn btn-danger">
        <i class="bi bi-trash3" aria-hidden="true"></i> Sí, eliminar comentario
      </button>
      <a class="btn btn-outline" href="{% url 'blog:post_detail' object.post_id %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}

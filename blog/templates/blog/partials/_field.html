<div class="form-group">
  <label class="form-label" for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %}<span class="form-required" aria-hidden="true">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<small class="form-help">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<div class="form-error">{{ error }}</div>{% endfor %}
</div>

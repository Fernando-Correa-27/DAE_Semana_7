{% extends "blog/base.html" %}

{% block title %}Eliminar etiqueta · Lab Blog{% endblock %}

{% block content %}
<div class="confirm-card">
  <div class="confirm-icon danger">
    <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
  </div>
  <h1>Eliminar etiqueta</h1>
  <p>Vas a eliminar la etiqueta <strong>«#{{ object.name }}»</strong>. Esta etiqueta se quitará de todos los artículos asociados.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions center">
      <button type="submit" class="btn btn-danger">
        <i class="bi bi-trash3" aria-hidden="true"></i> Sí, eliminar etiqueta
      </button>
      <a class="btn btn-outline" href="{% url 'blog:tag_list' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
